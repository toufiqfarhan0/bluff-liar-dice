<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#2b2d31"/>
      <stop offset="1" stop-color="#17181b"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2c30"/>
      <stop offset="1" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0d0f"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17181b"/>
      <stop offset="1" stop-color="#08090a"/>
    </linearGradient>
    <radialGradient id="rim" cx="321" cy="293" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBD53D" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#FBD53D" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FBD53D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="321" cy="293" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF6BF"/>
      <stop offset="0.45" stop-color="#FBD53D"/>
      <stop offset="1" stop-color="#E8A90F"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a8d94" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3a3c41" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="glowTight" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="hex">
      <polygon points="256,106 386,181 386,331 256,406 126,331 126,181"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Ground shadow -->
  <ellipse cx="256" cy="425" rx="120" ry="22" fill="#000" opacity="0.55" filter="url(#shadow)"/>

  <!-- Faces -->
  <polygon points="256,106 386,181 256,256 126,181" fill="url(#top)"/>
  <polygon points="126,181 256,256 256,406 126,331" fill="url(#left)"/>
  <polygon points="386,181 386,331 256,406 256,256" fill="url(#right)"/>

  <!-- Frosted glass sheen on top facet -->
  <polygon points="256,118 366,181 256,244 146,181" fill="#ffffff" opacity="0.035"/>
  <polygon points="146,181 256,118 366,181 340,181 256,133 172,181" fill="#ffffff" opacity="0.05"/>

  <!-- Recessed aperture on right facet (isometric-skewed) -->
  <g transform="matrix(130 -75 0 150 256 256)">
    <rect x="0.13" y="0.13" width="0.74" height="0.74" fill="#030304"/>
    <rect x="0.13" y="0.13" width="0.74" height="0.74" fill="none" stroke="#2c2e33" stroke-width="0.012"/>
    <rect x="0.17" y="0.17" width="0.66" height="0.66" fill="#0a0a0c"/>
    <rect x="0.17" y="0.17" width="0.66" height="0.66" fill="none" stroke="#000" stroke-width="0.02"/>
  </g>

  <!-- Amber glow -->
  <polygon points="321,254.5 354.8,274 321,332.5 287.2,313" fill="#FBD53D" opacity="0.85" filter="url(#glow)"/>
  <polygon points="321,254.5 354.8,274 321,332.5 287.2,313" fill="#FBD53D" filter="url(#glowTight)" opacity="0.9"/>

  <!-- Razor-sharp core -->
  <polygon points="321,254.5 354.8,274 321,332.5 287.2,313" fill="url(#core)"/>
  <polygon points="321,272.5 339.2,283 321,314.5 302.8,304" fill="#FFF6BF"/>
  <polygon points="321,254.5 354.8,274 321,332.5 287.2,313" fill="none" stroke="#FFE680" stroke-width="1" stroke-linejoin="miter"/>

  <!-- Volumetric rim light spill over adjacent faces -->
  <g clip-path="url(#hex)">
    <rect width="512" height="512" fill="url(#rim)"/>
  </g>

  <!-- Chamfered edges -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <polyline points="126,181 256,106 386,181" stroke="url(#edge)" stroke-width="3"/>
    <polyline points="126,181 126,331 256,406" stroke="#4a4c52" stroke-width="2.5" opacity="0.8"/>
    <polyline points="386,181 386,331 256,406" stroke="#6b5a22" stroke-width="2.5" opacity="0.9"/>
    <polyline points="126,181 256,256 386,181" stroke="#34363b" stroke-width="2"/>
    <line x1="256" y1="256" x2="256" y2="406" stroke="#2a2b30" stroke-width="2"/>
    <polyline points="256,256 256,406" stroke="#FBD53D" stroke-width="1.5" opacity="0.35"/>
    <polygon points="256,106 386,181 386,331 256,406 126,331 126,181" stroke="#050506" stroke-width="1.5" opacity="0.8"/>
  </g>
</svg>
